<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover the latest trends in urban fashion at UrbanStyle. Shop unique pieces that reflect your individuality.">
    <meta name="keywords" content="urban fashion, streetwear, unique style, fashion store, trendy clothing">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/favicon (3).ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <link rel="icon" href="img/favicon-32x32.png" sizes="32x32" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>UrbanStyle Fashion Store | Discover Your Unique Style</title>
</head>
<body>
    <header class="header">
    
        <div class="container"> 
           <nav class="main-nav">
             <a href="#home">
               <img src="img/logo.png" alt="UrbanStyle Fashion Store Logo" class="logo">
             </a>
             <ul class="main-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="collections.html" class="nav-link">Collections</a></li>
                <li><a href="about.html" class="nav-link">About Us</a></li>
                <li><a href="contact.html" class="nav-link">Contact</a></li>
             </ul>
           </nav>
           <a href="collections.html" class="btn btn-primary">Shop Collections <i class="fas fa-shopping-bag"></i></a>
        </div>
    </header>

     <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <div class="section-header">
                <h2>Contact Us</h2>
            </div>
            <p><strong>Email:</strong> <a href="mailto:info@urbanstyle.com">info@urbanstyle.com</a></p>
            <p><strong>Phone:</strong> <a href="tel:+2348031234567">+234 803 123 4567</a></p>
            <p><strong>Address:</strong> 123 Fashion Street, Ikeja, Lagos</p>
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div> 
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div> 
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" placeholder="Your Message" required></textarea>
                </div> 
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
            
        </div>
    </section>

     <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <nav class="footer-links" aria-label="Footer navigation">
                <a href="index.html">Home</a>

            </nav>
            <p class="copyright">&copy; 2026 UrbanStyle Fashion Store. All rights reserved.</p>
            <div class="social-links">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            </div>
        </div>
    
    </footer>

</body>
</html>
